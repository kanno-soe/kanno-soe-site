name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [source-push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout kanno-soe source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kanno-soe
          token: ${{ secrets.SOURCE_READ_TOKEN || github.token }}
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: source

      - name: Build frozen context
        run: |
          set -o pipefail
          node scripts/build-context.mjs --source source --repo-url "https://github.com/${{ github.repository_owner }}/kanno-soe" | tee context.log
          {
            echo "### kanno-soe context"
            grep -E "SOURCE_COMMIT=|CONTEXT_APPROX_TOKENS=|CONTEXT_SNAPSHOT=|CONTEXT_SNAPSHOT_BYTES=|EXPOSITION_HTML=" context.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        run: pnpm run check

      - name: Deploy Worker
        if: ${{ env.HAS_CLOUDFLARE_API_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

      - name: Skip deploy without Cloudflare token
        if: ${{ env.HAS_CLOUDFLARE_API_TOKEN != 'true' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not configured; build/typecheck passed, but deployment was skipped."
