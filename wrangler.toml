"$schema" = "./node_modules/wrangler/config-schema.json"
name = "kanno-soe"
main = "src/index.ts"
compatibility_date = "2026-07-06"

[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = ["/"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetDO", "TranscriptDO"]

[[migrations]]
tag = "v2"
deleted_classes = ["BudgetDO", "TranscriptDO"]
